[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Command-line Python, Java, and Ada development environment"
requires-python = ">=3.13,<3.14"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
    "uncertainties>=3.2.3",
]

[tool.uv]
package = false
prerelease = "disallow"
python-downloads = "never"
